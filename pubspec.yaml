name: greenops_carbontrace
description: "GreenOps CarbonTrace: KOBİler için denetlenebilir karbon defteri (Android)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Uygulama simgesi: dart run flutter_launcher_icons (kaynak çizim assets/icon/, projede üretildi)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0D1F29"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
